version: "3.9"

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.11.1
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow
    command: >
      mlflow server
        --backend-store-uri /mlflow/mlruns
        --default-artifact-root /mlflow/artifacts
        --host 0.0.0.0
        --port 5000
        --allowed-hosts "*"
  app:
    build: .
    volumes:
      - ./data:/app/data
      - ./mlflow:/mlflow
      - ./logs:/app/logs
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DATA_DIR=/app/data
